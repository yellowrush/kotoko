name: Deploy to GitHub Pages

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build and deploy web app to gh-pages branch
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check API_BASE_URL secret availability
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
        run: |
          if [ -n "$API_BASE_URL" ]; then
            echo "API_BASE_URL_SECRET=SET"
          else
            echo "API_BASE_URL_SECRET=MISSING"
          fi

      - name: Build
        run: pnpm --filter @kodoko/web build
        env:
          # 專案站台：https://yellowrush.github.io/kotoko/
          VITE_BASE_PATH: /kotoko/
          # 後端 API 部署在 Vercel（vercel.json + apps/api/vercel.ts）。
          # 在此 repo 的 Actions Secrets 設定 API_BASE_URL 指向 Vercel 網域即可覆寫預設的 /api/v1。
          VITE_API_BASE_URL: ${{ secrets.API_BASE_URL }}

      - name: SPA fallback for GitHub Pages
        run: |
          cp apps/web/dist/index.html apps/web/dist/404.html
          touch apps/web/dist/.nojekyll

      # 使用 branch 部署（gh-pages）以繞開 GitHub Actions 部署佇列卡住的問題。
      # 需要在 repo Settings → Pages → Source 改為「Deploy from a branch」→ gh-pages / (root)。
      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: apps/web/dist
          publish_branch: gh-pages
          force_orphan: false
