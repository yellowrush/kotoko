name: Collect Tokyo Events

on:
  schedule:
    - cron: '30 21 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: collect-tokyo-events
  cancel-in-progress: false

jobs:
  collect:
    name: Collect public Tokyo event candidates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Collect candidates
        run: node tools/tokyo-events/collect-tokyo-events.mjs --output-dir=artifacts/tokyo-events

      - name: Upload candidate artifact
        id: upload-candidates
        uses: actions/upload-artifact@v4
        with:
          name: tokyo-event-candidates
          path: artifacts/tokyo-events/*.json

      - name: Open review issue
        uses: actions/github-script@v7
        env:
          CANDIDATE_ARTIFACT_URL: ${{ steps.upload-candidates.outputs.artifact-url }}
        with:
          script: |
            const fs = require('node:fs');
            const path = require('node:path');
            const dir = 'artifacts/tokyo-events';
            const file = fs.readdirSync(dir).find((name) => name.endsWith('.json'));
            const payload = JSON.parse(fs.readFileSync(path.join(dir, file), 'utf8'));
            if (!payload.candidates.length) {
              core.info('No Tokyo event candidates found.');
              return;
            }

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const title = `Tokyo event candidates ${payload.runDate}`;
            const runUrl = `${process.env.GITHUB_SERVER_URL}/${owner}/${repo}/actions/runs/${process.env.GITHUB_RUN_ID}`;
            const artifactUrl = process.env.CANDIDATE_ARTIFACT_URL || runUrl;
            for (const label of [
              { name: 'content-intake', color: '0e8a16', description: 'Public content intake for human review' },
              { name: 'tokyo-events', color: '1d76db', description: 'Tokyo event candidate collection' },
            ]) {
              try {
                await github.rest.issues.createLabel({ owner, repo, ...label });
              } catch (error) {
                if (error.status !== 422) throw error;
              }
            }
            const preview = payload.candidates.slice(0, 20).map((candidate, index) => [
              `${index + 1}. ${candidate.title}`,
              `   - Category: ${candidate.category}`,
              `   - Date: ${candidate.startsAt || 'unknown'}${candidate.endsAt ? ` - ${candidate.endsAt}` : ''}`,
              `   - Venue: ${candidate.venueName || candidate.address || 'unknown'}`,
              `   - Source: ${candidate.sourceUrl}`,
              `   - Confidence: ${candidate.confidence}`,
            ].join('\n')).join('\n\n');
            const errors = payload.errors.slice(0, 10).map((error) => [
              `- ${error.source}`,
              `  ${error.message}`,
            ].join('\n')).join('\n');
            const compactJson = JSON.stringify({
              runDate: payload.runDate,
              fetchedAt: payload.fetchedAt,
              sourceCount: payload.sourceCount,
              candidateCount: payload.candidates.length,
              candidates: payload.candidates.slice(0, 20),
              errors: payload.errors.slice(0, 10),
            }, null, 2);
            const body = [
              `Daily public Tokyo event collection produced ${payload.candidates.length} candidates from ${payload.sourceCount} resources.`,
              '',
              `Full JSON artifact: ${artifactUrl}`,
              `Workflow run: ${runUrl}`,
              `Artifact file: \`${file}\``,
              '',
              'Candidate preview:',
              '',
              preview,
              payload.candidates.length > 20 ? `\n\nShowing 20 of ${payload.candidates.length}. Use the artifact URL for the full JSON file.` : '',
              '',
              payload.errors.length ? 'Collector errors:' : 'Collector errors: 0',
              payload.errors.length ? errors : '',
              '',
              '<details>',
              '<summary>Preview JSON</summary>',
              '',
              '```json',
              compactJson,
              '```',
              '',
              '</details>',
              '',
              'Review rules:',
              '- Publish only public event/place data.',
              '- Do not add child profile, IndexedDB, contact, analytics, or private location data.',
              '- Confirm source URL, event date, venue, and license before editing app data.',
              '- Prefer official sources; commercial sources require explicit authorization.',
            ].join('\n');

            const existing = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: 'open',
              labels: 'content-intake,tokyo-events',
              per_page: 100,
            });
            const sameDay = existing.find((issue) => issue.title === title);
            if (sameDay) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: sameDay.number,
                body,
              });
              return;
            }

            await github.rest.issues.create({
              owner,
              repo,
              title,
              body,
              labels: ['content-intake', 'tokyo-events'],
            });
