name: Keep API warm

on:
  schedule:
    # Koyeb 免費例項閒置 1 小時會休眠，每 50 分鐘 ping 一次健康檢查。
    - cron: '*/50 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    name: Ping API health endpoint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping /api/v1/health
        run: curl -fsS --max-time 60 "${{ secrets.API_BASE_URL }}/health" || exit 1
